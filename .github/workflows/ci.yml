name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - lts
          - latest
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test
      - run: vp pack
